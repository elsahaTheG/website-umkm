<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Etalase Teh Saha</title>
  <desc id="desc">Ilustrasi tiga kemasan Teh Saha di atas meja kayu.</desc>
  
  <!-- Latar Belakang & Meja (Warna Dark & Hijau Tema) -->
  <rect width="640" height="360" fill="#111111" />
  <rect y="260" width="640" height="100" fill="#1a1a1a" stroke="#1e4d2b" stroke-width="2" />

  <!-- Kemasan Teh (Hijau Gelap Hero) -->
  <g fill="#1e4d2b" stroke="#00ff41" stroke-width="2">
    <rect x="100" y="100" width="130" height="170" rx="12" />
    <rect x="255" y="70" width="130" height="200" rx="12" />
    <rect x="410" y="115" width="130" height="155" rx="12" />
  </g>

  <!-- Label Produk Teh Saha (Warna Neon Green & Putih) -->
  <g fill="#00ff41" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <!-- Kemasan 1 -->
    <text x="165" y="175" font-size="16" fill="#ffffff">Java Tea</text>
    <text x="165" y="195" font-size="16">Script</text>
    
    <!-- Kemasan 2 (Utama / Teh Saha) -->
    <text x="320" y="155" font-size="18" fill="#ffffff">Teh Saha</text>
    <text x="320" y="180" font-size="13">Error 404 Tea</text>
    <text x="320" y="200" font-size="11" fill="#888888">(Zero Sugar)</text>
    
    <!-- Kemasan 3 -->
    <text x="475" y="175" font-size="16" fill="#ffffff">Localhost</text>
    <text x="475" y="195" font-size="16">Tea</text>
  </g>
</svg>
